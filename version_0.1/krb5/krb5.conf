[libdefaults]
        default_realm   =       SCHOOL.WESTLINE.LAN
        clockskew       =       300
        ticket_lifetime =       1d
        forwardable     =       true
        proxiable       =       true
        dns_lookup_realm =      true
        dns_lookup_kdc  =       true
        allow_weak_crypto =     true

[realms]
        SCHOOL.WESTLINE.LAN = {
                kdc     =       SCHOOL.WESTLINE.LAN
                admin_server = SCHOOL.WESTLINE.LAN
                default_domain = SCHOOL.WESTLINE.LAN
        }

[domain_realm]
        .kerberos.server = SCHOOL.WESTLINE.LAN
        .school.westline.lan = SCHOOL.WESTLINE.LAN
        school.westline.lan = SCHOOL.WESTLINE.LAN
        WESTLINE = SCHOOL.WESTLINE.LAN 

[appdefaults]
        pam = {
        ticket_lifetime         = 1d
        renew_lifetime          = 1d
        forwardable             = true
        proxiable               = false
        retain_after_close      = false
        minimum_uid             = 0
        debug                   = false
        }

[logging]
        default                 = FILE:/var/log/krb5libs.log
        kdc                     = FILE:/var/log/kdc.log
        admin_server            = FILE:/var/log/kadmind.log